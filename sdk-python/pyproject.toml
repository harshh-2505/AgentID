[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentid"
version = "0.1.0"
description = "Identity, authorization and co-sign for autonomous AI agents (Python SDK)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]

[tool.setuptools]
packages = ["agentid"]
