name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - run: npm ci
      - run: npm test
      - name: Property tests on extra seeds
        run: for s in 1 42 1337; do AGENTID_SEED=$s node --test test/property.test.js; done
      - name: Policy check and widening gate
        run: node policy/cli.js check policy/examples/northwind.agentid

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - run: python -m unittest discover -s sdk-python/tests -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: agentid
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Postgres store against a real server
        env:
          AGENTID_TEST_DATABASE_URL: postgres://postgres:agentid@localhost:5432/postgres
        run: node --test test/postgres-store.test.js
